version = 1

# The series' name lives in the table: TOML refuses `series = "…"` beside
# `[series]` (H-019).
[series]
name = "<project>-<series>"
kickoff = "Execute WORKPLAN.md run 1"

# The architect role (DESIGN §31). With `[roles.architect]` in the config, handsd
# starts a headless architect for one consultation on each review outcome: it
# reads the review and meta/ROADMAP.md from its own clone, writes the next kit,
# checks it, and files it with `hands kit file`. To run the series that way,
# uncomment every line between the `>>> architect` markers below (strip one
# "# " from each) and read docs/INTEGRATION.md "The architect role" first:
# approving an `autonomous` playbook approves every apply the architect files
# under it, with no further gate.
# >>> architect
# architect = "role"
# autonomous = true
# gate_failures = 2
# escalate_on = ["blocker-unanswered", "milestone-missing", "budget-exhausted"]
# kit_wait_s = 600               # seconds `next kit` waits for its kit (§32)
# <<< architect

[limits]
auto_runs = [2, 3]        # runs already grouped in WORKPLAN.md §2; anything else stops
max_resumes = 3

# >>> architect
# max_architect_consults = 12    # architect consultations per series (§31)
# <<< architect

# Run finished → cold review on the branch.
[[rule]]
on = "builder.done"
verdict = '^VERDICT: run (?P<n>\d+) finished'
then = "send"
role = "aux"
context = "clear"
prompt = "Review WORKPLAN.md commits since the last review: commit on this branch, per WORKPLAN.md §0.2. Begin your reply with: VERDICT: review run {n} blockers=<k> should-fix=<m>"

# The review outcome goes to the architect, which writes the next kit or
# escalates (§31). It stands before the `aux.done` rules below on purpose: §10
# fires the first rule that matches, and under autonomy this is the one that
# should. The architect's own reply is not an event a rule can match — the
# engine reads its verdict itself.
# >>> architect
# [[rule]]
# on = "aux.done"
# verdict = '^VERDICT: review run (?P<n>\d+) blockers='
# then = "consult"
# role = "architect"
# <<< architect

# Review clean and the next run is pre-planned → merge and go (PR shape, §9).
[[rule]]
on = "aux.done"
verdict = '^VERDICT: review run (?P<n>\d+) blockers=0'
then = "send"
role = "builder"
context = "clear"
run = "{n+1}"
prompt = "The review of run {n} has no blockers. Confirm the PR's checks are green, merge it with gh pr merge --squash, then Execute WORKPLAN.md run {n+1} on a new branch from main. Begin your reply with: VERDICT: run {n+1} finished, or VERDICT: run {n+1} blocked <reason>, or VERDICT: question <one line>"

[[rule]]
on = "aux.done"
verdict = '^VERDICT: review run (?P<n>\d+) blockers=[1-9]'
then = "stop"
message = "Run {n} review has blockers"

[[rule]]
on = "builder.done"
verdict = '^VERDICT: run (?P<n>\d+) blocked'
then = "stop"
message = "Run {n} blocked"

[[rule]]
on = "builder.done"
verdict = '^VERDICT: (awaiting decision|question)'
then = "stop"
message = "The builder needs a decision"

# Under an autonomous architect series this rule does not fire: the engine sends
# `[series] kickoff` itself on the same verdict, ahead of every rule here (§31).
[[rule]]
on = "builder.done"
verdict = '^VERDICT: kit applied'
then = "notify"
message = "Kit applied"

[[rule]]
on = "builder.done"
then = "stop"
message = "Builder finished without a recognised verdict"

[[rule]]
on = "aux.done"
then = "stop"
message = "Aux finished without a recognised verdict"

[[rule]]
on = "builder.orphaned"
then = "resume"

[[rule]]
on = "builder.failed"
then = "resume"

[[rule]]
on = "aux.failed"
then = "stop"
message = "Aux job failed"

[[rule]]
on = "monitor.stall"
then = "notify"
message = "Builder looks stalled"

[[rule]]
on = "monitor.tripwire"
then = "stop"
message = "Tripwire fired"

[[rule]]
on = "monitor.task_killed"
then = "notify"
message = "The harness killed a task inside a role session"

[[rule]]
on = "monitor.orphan_processes"
then = "stop"
message = "Processes outlived their job"


[[rule]]
on = "job.denied"
then = "notify"
message = "A held job was denied"
