version = 1

# §26: the series' name and the kickoff line `go` sends from the phone. The name
# lives in the table: TOML cannot hold `series = "…"` beside `[series]` (H-019).
[series]
name = "hands-missions"
kickoff = "Read meta/BUILDER-16-PROMPT.md and execute the mission below its divider."
# §31: the architect is the human in a chat Project, not a role handsd starts.
# That is the default; this series states it.
architect = "phone"

[limits]
max_resumes = 2
max_consults = 2

# The builder finished a mission → cold review by aux, cold (no context).
[[rule]]
on = "builder.done"
verdict = '^VERDICT: mission (?P<n>\d+) finished'
then = "send"
role = "aux"
context = "clear"
prompt = "Read meta/REVIEW-PROTOCOL.md and review mission {n} of this repository: every commit after the last review: commit on origin/main (the protocol says how to find the base). Follow the protocol exactly, commit only meta/reviews/REVIEW-{n}.md, and begin your reply with the VERDICT line it specifies."

# A kit was applied: worth a note, not a stop.
[[rule]]
on = "builder.done"
verdict = '^VERDICT: kit applied'
then = "notify"
message = "Kit applied; the next kickoff is the driver's"

# The builder stopped for a reason → the human.
[[rule]]
on = "builder.done"
verdict = '^VERDICT: mission (?P<n>\d+) blocked'
then = "stop"
message = "Mission {n} blocked; see the builder's reply"

# §27: a question, and any verdict not recognised above, goes to the driver
# role, not straight to the human. The catch-all matches on `^VERDICT:` so a
# reply with no VERDICT: line still stops (§10). Never on review outcomes,
# held gates or monitor events.
[[rule]]
on = "builder.done"
verdict = '^VERDICT: question'
then = "consult"
role = "driver"

[[rule]]
on = "builder.done"
verdict = '^VERDICT:'
then = "consult"
role = "driver"

# The consultation's outcome. resolved: the driver already sent its keep
# answer, so only the phone hears it. escalate, anything else, or a failed
# driver job: the human.
[[rule]]
on = "driver.done"
verdict = '^VERDICT: resolved (?P<what>.+)'
then = "notify"
message = "Consult resolved: {what}"

[[rule]]
on = "driver.done"
verdict = '^VERDICT: escalate (?P<reason>.+)'
then = "stop"
message = "The driver escalated: {reason}"

[[rule]]
on = "driver.done"
then = "stop"
message = "Driver finished without a recognised verdict"

[[rule]]
on = "driver.failed"
then = "stop"
message = "Driver job failed"

# Review outcomes: no auto-continue in this series; every outcome is a stop
# with a distinct message, so the notification says which.
[[rule]]
on = "aux.done"
verdict = '^VERDICT: review mission (?P<n>\d+) blockers=0'
then = "stop"
message = "Mission {n} reviewed clean; next mission is the architect's"

[[rule]]
on = "aux.done"
verdict = '^VERDICT: review mission (?P<n>\d+) blockers='
then = "stop"
message = "Mission {n} review has blockers"

[[rule]]
on = "aux.done"
then = "stop"
message = "Aux finished without a recognised verdict"

# Process trouble: one retry each, then it stops on its own via max_resumes.
[[rule]]
on = "builder.orphaned"
then = "resume"

[[rule]]
on = "builder.failed"
then = "resume"

[[rule]]
on = "aux.failed"
then = "stop"
message = "Aux job failed"

# Liveness: a stall is worth a look, not a stop.
[[rule]]
on = "monitor.stall"
then = "notify"
message = "Builder looks stalled"

[[rule]]
on = "monitor.tripwire"
then = "stop"
message = "Tripwire fired"


[[rule]]
on = "job.denied"
then = "notify"
message = "A held job was denied"

# The mission 8 detectors (DESIGN §24): work a role job was waiting on, or had
# started, did not finish with it. Both call the human.
[[rule]]
on = "monitor.task_killed"
then = "stop"
message = "A task inside a role job was killed"

[[rule]]
on = "monitor.orphan_processes"
then = "stop"
message = "A role job left processes running"
