[project]
name = "hands"
version = "0.1.0"
description = "A daemon and CLI that dispatch prompts to headless Claude Code roles and chain them by a playbook."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
hands = "hands.cli:main"
handsd = "hands.daemon:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Shipped driver artifact (DESIGN §12): long guard regexes and their case table
# read better on one line than wrapped.
"driver/hooks/bash_guard.py" = ["E501"]
