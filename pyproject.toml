[project]
name = "hands"
version = "0.1.0"
description = "A daemon and CLI that dispatch prompts to headless Claude Code roles and chain them by a playbook."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "idna>=3"]

[project.scripts]
hands = "hands.cli:main"
handsd = "hands.daemon:main"
handswho = "hands.who:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hands"]

# DESIGN §34: `hands doctor` compares the role's guard, by sha256, with the guard this
# repository ships; an installed wheel carries that file for it (`hands/shipped/`).
[tool.hatch.build.targets.wheel.force-include]
"driver/hooks/bash_guard.py" = "hands/shipped/bash_guard.py"
# DESIGN §38 (HF-002): `hands handbook` and the role's `HANDS_DOCS` name the handbook and
# templates of the installed hands, so the wheel carries them, in the repository's layout.
"docs" = "hands/shipped/docs"
"templates" = "hands/shipped/templates"
# DESIGN §38 "Onboarding": `hands project add` copies the role directories' settings
# and CLAUDE.md and the handsd unit from the installed hands, in the same layout.
"driver/settings.json" = "hands/shipped/driver/settings.json"
"driver/CLAUDE.md" = "hands/shipped/driver/CLAUDE.md"
"architect/settings.json" = "hands/shipped/architect/settings.json"
"architect/CLAUDE.md" = "hands/shipped/architect/CLAUDE.md"
"systemd/handsd@.service" = "hands/shipped/systemd/handsd@.service"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Shipped driver artifact (DESIGN §12): long guard regexes and their case table
# read better on one line than wrapped.
"driver/hooks/bash_guard.py" = ["E501"]
